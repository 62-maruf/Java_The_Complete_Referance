
name: Automatically Update README

on:
  push:
    branches:
      - main
    paths:
      - '**.java'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README table
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start = "<!-- JAVA_FILES_START -->"
          end = "<!-- JAVA_FILES_END -->"

          files = sorted(Path(".").rglob("*.java"))

          rows = [
              "| No. | Topic | Source Code |",
              "|---|---|---|"
          ]

          for i, file in enumerate(files, 1):
              path = file.as_posix()
              rows.append(
                  f"| {i:02d} | {file.stem} | [{file.name}](./{path}) |"
              )

          table = start + "\n" + "\n".join(rows) + "\n" + end

          if start in content and end in content:
              before = content.split(start)[0]
              after = content.split(end, 1)[1]
              content = before + table + after
          else:
              content += "\n" + table + "\n"

          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Automatically update Java files table"
            git push
          fi
